name: Godot CI

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import and parse project
        run: "$GODOT_BIN" --headless --path game --editor --quit

      - name: Run scene smoke test
        run: "$GODOT_BIN" --headless --path game --script res://tests/smoke_test.gd

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: game/.godot/logs/
          if-no-files-found: ignore
          retention-days: 7
