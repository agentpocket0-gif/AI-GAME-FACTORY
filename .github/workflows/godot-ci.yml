name: Godot CI

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "games/**"
      - "tools/**"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "game/**"
      - "games/**"
      - "tools/**"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Python model SDK
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configs, workflows, helper scripts and export preset
        run: |
          python3 -m json.tool config/model-routing.json > /dev/null
          python3 - <<'PY'
          import configparser
          import glob
          from pathlib import Path
          import yaml

          for path in glob.glob(".github/workflows/*.yml"):
              with open(path, encoding="utf-8") as file:
                  yaml.safe_load(file)

          with open("config/dsh-profile-overlay.example.yml", encoding="utf-8") as file:
              yaml.safe_load(file)

          preset = configparser.ConfigParser(interpolation=None, strict=False)
          if not preset.read("game/export_presets.cfg"):
              raise SystemExit("Android export preset could not be read")
          if preset.get("preset.0", "platform").strip('"') != "Android":
              raise SystemExit("Export preset 0 is not Android")
          if preset.get("preset.0.options", "architectures/arm64-v8a").strip('"').lower() != "true":
              raise SystemExit("Android export preset must enable arm64-v8a")
          print("YAML, DSH overlay and Android export preset are valid.")
          PY
          python3 -m py_compile tools/*.py
          python3 tools/gemini_video_review.py --help > /dev/null
          python3 tools/gemma_reason.py --help > /dev/null
          python3 -m unittest discover -s tests/py -v

      - name: Import and parse project
        run: $GODOT_BIN --headless --path game --editor --quit

      - name: Run gameplay smoke tests
        run: $GODOT_BIN --headless --path game --script res://tests/smoke_test.gd

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: game/.godot/logs/
          if-no-files-found: ignore
          retention-days: 7


  prism-grove-android-debug:
    name: Prism Grove Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot 4.7.2 and export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O "$RUNNER_TEMP/godot/godot.zip"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Generate original sound effects
        working-directory: games/prism-grove
        run: python3 scripts/generate_audio.py

      - name: Import and parse Prism Grove
        working-directory: games/prism-grove
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Run Prism Grove gameplay smoke tests
        working-directory: games/prism-grove
        run: '"$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd'

      - name: Install Godot Android Gradle build template
        working-directory: games/prism-grove
        run: '"$GODOT_BIN" --headless --editor --path . --install-android-build-template --quit'

      - name: Export Android arm64 debug APK
        working-directory: games/prism-grove
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" --headless --path . --export-debug Android "$GITHUB_WORKSPACE/build/PrismGrove-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/PrismGrove-debug.apk"

      - name: Verify APK package, target SDK and signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build/PrismGrove-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/prism-grove-badging.txt"
          grep -q "package: name='com.agentpocket.prismgrove'" "$RUNNER_TEMP/prism-grove-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/prism-grove-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Prism Grove debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PrismGrove-Android-arm64-debug
          path: build/PrismGrove-debug.apk
          if-no-files-found: error
          retention-days: 14
