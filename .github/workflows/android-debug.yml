name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot 4.7.2 Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-templates"
          cd "$RUNNER_TEMP/godot-templates"
          curl -fsSLO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_ROOT"
          if [ -d templates ]; then
            cp -R templates/. "$TEMPLATE_ROOT/"
          else
            find . -maxdepth 2 -type f -print
            echo "Godot export template archive had an unexpected layout." >&2
            exit 1
          fi
          test -f "$TEMPLATE_ROOT/android_debug.apk"

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path game --editor --quit
          "$GODOT_BIN" --headless --path game --export-debug "Android" build/BoardMastersArena-debug.apk
          test -s build/BoardMastersArena-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BoardMastersArena-Android-debug
          path: build/BoardMastersArena-debug.apk
          if-no-files-found: error
          retention-days: 14
